name: CI

# The site is generated by build.py and the output is committed, so the two
# things worth proving are: the data parses, and the committed HTML actually
# matches what build.py produces from it.
on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py is standard library only — nothing to install.

      - name: Validate every data/*.json parses
        run: |
          for f in data/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1],encoding='utf8')); print('ok:', sys.argv[1])" "$f"
          done

      - name: Rebuild the site
        run: python build.py

      - name: Committed HTML must match the generated output
        run: |
          if ! git diff --quiet; then
            echo '::error::build.py output differs from what is committed. Run `python build.py` and commit the result.'
            git diff --stat
            exit 1
          fi

      - name: Key pages exist and are not empty
        run: |
          for f in index.html lamps/index.html decorations/index.html legal/index.html sitemap.xml CNAME; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
          done

      # data/site.json legitimately contains PLACEHOLDER markers; rendered pages
      # must never. This check exists because a placeholder hospital name did
      # reach production once.
      - name: No placeholder text in any rendered page
        run: |
          if grep -rn --include='*.html' PLACEHOLDER .; then
            echo '::error::PLACEHOLDER text found in generated HTML — fill it in or guard it in build.py'
            exit 1
          fi
          echo 'ok: no placeholder text in rendered pages'
